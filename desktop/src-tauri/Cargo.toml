[package]
name = "nuvio-deskremote-companion"
version = "0.4.1"
description = "Nuvio DeskRemote Companion — Native Windows desktop companion (Tauri v2) for HTPC, Trackpad, and Screen Share"
authors = ["Nuvio DeskRemote Contributors"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "nuvio_deskremote_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", features = ["blocking"] }
